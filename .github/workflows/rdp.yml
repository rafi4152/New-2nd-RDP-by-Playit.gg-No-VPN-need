name: win 11 + Multi-Tunnel + Auto-Optimize

on:
  workflow_dispatch:

jobs:
  ultra-fast-rdp:
    runs-on: windows-latest
    timeout-minutes: 357

    steps:
      - name: Core RDP & Extreme Network Optimization
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force

          # Network Optimization for 5G/Mobile Latency
          netsh int tcp set global autotuninglevel=experimental
          netsh int tcp set global ecncapability=enabled

          # RDP Video H.264 Optimization
          reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" /v fEnableH264AVC444 /t REG_DWORD /d 1 /f
          reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" /v fEnableRemoteFXAdvancedRemoteApp /t REG_DWORD /d 1 /f
          reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" /v MinSendInterval /t REG_DWORD /d 10 /f
          reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" /v MaxDisableFontSmoothing /t REG_DWORD /d 1 /f
          
          # UI Animation Disable for Performance
          reg add "HKCU\Control Panel\Desktop" /v UserPreferencesMask /t REG_BINARY /d 9012038010000000 /f
          reg add "HKCU\Control Panel\Desktop\WindowMetrics" /v MinAnimate /t REG_SZ /d 0 /f

          # Allow Multi-User RDP
          reg add "HKLM\System\CurrentControlSet\Control\Terminal Server" /v fSingleSessionPerUser /t REG_DWORD /d 0 /f

          netsh advfirewall firewall add rule name="RDP-Tunnel" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create Dual Users (Admin & Mobile)
        shell: powershell
        run: |
          $password = "Aziz@2006"
          $securePass = ConvertTo-SecureString$password -AsPlainText -Force
          
          New-LocalUser -Name "Admin" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "Admin"
          
          New-LocalUser -Name "Mobile" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "Mobile"

      - name: Start Unlimited Tunnels (Bore & Serveo)
        shell: powershell
        run: |
          Write-Host "[1/3] Downloading Tunneling Tool..."
          Invoke-WebRequest -Uri "https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-pc-windows-msvc.zip" -OutFile "$env:TEMP\bore.zip"
          Expand-Archive -Path "$env:TEMP\bore.zip" -DestinationPath "$env:TEMP\bore" -Force

          Write-Host "[2/3] Configuring SSH Backup Tunnel..."
          ssh-keygen -t rsa -N '""' -f "$HOME\.ssh\id_rsa" | Out-Null
          if (-not (Test-Path "$HOME\.ssh")) { New-Item -ItemType Directory -Path "$HOME\.ssh" -Force | Out-Null }
          Add-Content "$HOME\.ssh\config" "Host serveo.net`n  StrictHostKeyChecking no`n"

          Write-Host "[3/3] Starting Redundant Tunnels in Background..."
          Start-Process -FilePath "$env:TEMP\bore\bore.exe" -ArgumentList "local 3389 --to bore.pub" -RedirectStandardOutput "$env:TEMP\bore.log" -WindowStyle Hidden
          Start-Process -FilePath "ssh" -ArgumentList "-R 0:localhost:3389 serveo.net" -RedirectStandardOutput "$env:TEMP\serveo.log" -RedirectStandardError "$env:TEMP\serveo_err.log" -WindowStyle Hidden
          
          Write-Host "Waiting 15 seconds for network routes to stabilize..."
          Start-Sleep -Seconds 15
          
          Write-Host "`n======================================================="
          Write-Host "   🚀 MULTI-TUNNEL RDP CONNECTIONS (READY) 🚀"
          Write-Host "======================================================="
          
          $boreLog = Get-Content "$env:TEMP\bore.log" -ErrorAction SilentlyContinue | Out-String
          $boreMatch = [regex]::match($boreLog, 'listening at (bore\.pub:\d+)')
          if ($boreMatch.Success) { Write-Host "✅ LINK 1 (Bore Primary)  : $($boreMatch.Groups[1].Value)" }
          
          $serveoLog = Get-Content "$env:TEMP\serveo.log", "$env:TEMP\serveo_err.log" -ErrorAction SilentlyContinue | Out-String
          $serveoMatch = [regex]::match($serveoLog, 'serveo\.net:(\d+)')
          if ($serveoMatch.Success) { Write-Host "✅ LINK 2 (Serveo Backup) : serveo.net:$($serveoMatch.Groups[1].Value)" }

          Write-Host "-------------------------------------------------------"
          Write-Host "👥 USERS: 'Admin' OR 'Mobile'"
          Write-Host "🔑 PASS : Aziz@2006"
          Write-Host "=======================================================`n"

      - name: Maintain Connection & Auto Script
        shell: powershell
        run: |
          $rdpProfile = "C:\Users\Admin"
          $startupPath = "$rdpProfile\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup"
          $downloadUrl = "https://gitlab.com/MR.English2008/pcme_rdp/-/raw/main/Downloads.bat"
          $downloadPath = "$startupPath\Downloads.bat"

          while ($true) {
              if (Test-Path $rdpProfile) {
                  try {
                      if (-not (Test-Path $startupPath)) { New-Item -ItemType Directory -Path$startupPath -Force | Out-Null }
                      Invoke-WebRequest -Uri $downloadUrl -OutFile$downloadPath -UseBasicParsing
                      cmd /c $downloadPath
                      break
                  } catch { break }
              } else { Start-Sleep -Seconds 10 }
          }
          while ($true) { Start-Sleep -Seconds 300 }
