name: win 11 + Tailscale + Multi-User + Auto-Optimize

on:
  workflow_dispatch:

jobs:
  ultra-fast-rdp:
    runs-on: windows-latest
    timeout-minutes: 357

    steps:
      - name: 🚀 Core RDP & Extreme Network Optimization
        shell: powershell
        run: |
          Write-Host ">>> [1/5] Configuring Core RDP Settings..."
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force

          Write-Host ">>> [2/5] Applying 5G/Mobile Network Optimizations (Low Latency)..."
          netsh int tcp set global autotuninglevel=experimental
          netsh int tcp set global ecncapability=enabled

          Write-Host ">>> [3/5] Applying H.264 Video Compression & Graphics Tweaks..."
          reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" /v fEnableH264AVC444 /t REG_DWORD /d 1 /f
          reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" /v fEnableRemoteFXAdvancedRemoteApp /t REG_DWORD /d 1 /f
          reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" /v MinSendInterval /t REG_DWORD /d 10 /f
          reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" /v MaxDisableFontSmoothing /t REG_DWORD /d 1 /f
          
          Write-Host ">>> [4/5] Disabling Heavy UI Animations for Faster Response..."
          reg add "HKCU\Control Panel\Desktop" /v UserPreferencesMask /t REG_BINARY /d 9012038010000000 /f
          reg add "HKCU\Control Panel\Desktop\WindowMetrics" /v MinAnimate /t REG_SZ /d 0 /f

          Write-Host ">>> [5/5] Enabling Multi-User & Firewall Rules..."
          reg add "HKLM\System\CurrentControlSet\Control\Terminal Server" /v fSingleSessionPerUser /t REG_DWORD /d 0 /f
          netsh advfirewall firewall delete rule name="RDP-Tailscale" -ErrorAction SilentlyContinue
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force
          Write-Host "✅ Network and RDP optimizations applied successfully!"

      - name: 👥 Create Dual Users (Admin & Mobile)
        shell: powershell
        run: |
          $password = "Aziz@2006"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          
          Write-Host ">>> Creating [Admin] user with Administrator privileges..."
          if (-not (Get-LocalUser -Name "Admin" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "Admin" -Password $securePass -AccountNeverExpires
          }
          Add-LocalGroupMember -Group "Administrators" -Member "Admin"
          
          Write-Host ">>> Creating [Mobile] user for phone access..."
          if (-not (Get-LocalUser -Name "Mobile" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "Mobile" -Password $securePass -AccountNeverExpires
          }
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "Mobile"
          
          Write-Host "✅ Dual users created successfully!"

      - name: 🌐 Install & Connect Tailscale
        shell: powershell
        run: |
          Write-Host ">>> Downloading Tailscale Installer..."
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          
          Write-Host ">>> Installing Tailscale (Silent Mode)..."
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force
          
          Write-Host ">>> Authenticating with Tailscale Network..."
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
          
          Write-Host ">>> Waiting for Tailscale IP assignment..."
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          
          if (-not $tsIP) {
              Write-Error "❌ Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
          Write-Host "✅ Tailscale connected successfully! IP: $tsIP"

      - name: 📡 Verify RDP Accessibility
        shell: powershell
        run: |
          Write-Host ">>> Testing TCP connectivity to RDP port 3389 on $env:TAILSCALE_IP..."
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "❌ TCP connection to RDP port 3389 failed."
              exit 1
          }
          Write-Host "✅ TCP connectivity successful! Port 3389 is open."

      - name: 🚀 Final Output, Auto-Script & Keep Alive
        shell: powershell
        run: |
          Write-Host "`n================================================================="
          Write-Host "   🟢 ULTRA-FAST RDP SERVER IS READY 🟢"
          Write-Host "================================================================="
          Write-Host "🔗 IP ADDRESS : $env:TAILSCALE_IP"
          Write-Host "👥 USERS      : 'Admin' (PC) OR 'Mobile' (Phone)"
          Write-Host "🔑 PASSWORD   : Aziz@2006"
          Write-Host "=================================================================`n"

          $rdpProfile = "C:\Users\Admin"
          $startupPath = "$rdpProfile\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup"
          $downloadUrl = "https://gitlab.com/MR.English2008/pcme_rdp/-/raw/main/Downloads.bat"
          $downloadPath = "$startupPath\Downloads.bat"

          while ($true) {
              if (Test-Path $rdpProfile) {
                  try {
                      if (-not (Test-Path $startupPath)) {
                          New-Item -ItemType Directory -Path $startupPath -Force | Out-Null
                      }
                      Write-Host ">>> Downloading startup batch script..."
                      Invoke-WebRequest -Uri $downloadUrl -OutFile $downloadPath -UseBasicParsing
                      Write-Host "✅ Downloads.bat copied to $downloadPath"
                      
                      Write-Host ">>> Executing Downloads.bat..."
                      cmd /c $downloadPath
                      Write-Host "✅ Downloads.bat executed successfully!"
                      break
                  }
                  catch {
                      Write-Host "❌ Error executing Downloads.bat: $($_.Exception.Message)"
                      break
                  }
              }
              else {
                  Write-Host "[$(Get-Date)] Waiting for Admin profile to be initialized (Log in to create profile)..."
                  Start-Sleep -Seconds 30
              }
          }

          Write-Host "`n>>> System is now running in Keep-Alive mode for 6 hours..."
          while ($true) {
              Start-Sleep -Seconds 300
          }
